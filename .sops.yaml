# One shard per consuming module, encrypted to the admin plus the hosts that run it.
# Anchor path_regex on the full path: shard files share the secrets*.yaml names.
creation_rules:
  # No Nix consumer -- stored data only (the admin's own stashed key).
  - path_regex: modules/sops/secrets\.admin\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *user_aidanp_yubikey_a
      - *user_aidanp_yubikey_b
      - *user_aidanp_se

  # modules/user/default.nix -- every host.
  - path_regex: modules/user/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *user_aidanp_yubikey_a
      - *user_aidanp_yubikey_b
      - *user_aidanp_se
      - *server_artemis
      - *server_alda
      - *server_vida
      - *server_zantark
      - *server_peria
      - *server_ricklent

  # modules/hosts/artemis/default.nix -- artemis only.
  - path_regex: modules/hosts/artemis/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *user_aidanp_yubikey_a
      - *user_aidanp_yubikey_b
      - *user_aidanp_se
      - *server_artemis

  # modules/claude-code/default.nix -- the hosts that run Claude Code.
  - path_regex: modules/claude-code/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *user_aidanp_yubikey_a
      - *user_aidanp_yubikey_b
      - *user_aidanp_se
      - *server_artemis
      - *server_zakkart

  # modules/mcp/default.nix -- the hosts that run the MCP clients.
  - path_regex: modules/mcp/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *user_aidanp_yubikey_a
      - *user_aidanp_yubikey_b
      - *user_aidanp_se
      - *server_artemis
      - *server_zakkart

  # modules/backup-tunnel/default.nix -- both tunnel endpoints.
  - path_regex: modules/backup-tunnel/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *user_aidanp_yubikey_a
      - *user_aidanp_yubikey_b
      - *user_aidanp_se
      - *server_artemis
      - *server_alda

  # modules/hosts/legion/default.nix -- every Legion node.
  - path_regex: modules/hosts/legion/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *user_aidanp_yubikey_a
      - *user_aidanp_yubikey_b
      - *user_aidanp_se
      - *server_alda
      - *server_vida
      - *server_zantark
      - *server_peria
      - *server_ricklent

  # modules/backups/default.nix -- only the Legion nodes that own a Backup
  # Set. One repository password covers every Legion repository, so a node
  # with no backup job must not be a recipient.
  - path_regex: modules/backups/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *user_aidanp_yubikey_a
      - *user_aidanp_yubikey_b
      - *user_aidanp_se
      - *server_vida
      - *server_peria

  # modules/backups/default.nix (the /persist job) -- artemis only.
  - path_regex: modules/backups/secrets\.artemis\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *user_aidanp_yubikey_a
      - *user_aidanp_yubikey_b
      - *user_aidanp_se
      - *server_artemis

  # modules/edge/default.nix and modules/tinyauth.nix.
