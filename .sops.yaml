keys:
  - &user_aidanp age1yy2uxasknys578edlnepcxug2j37ntep0tudfv9nr7qqx6d9ws3sack68y
  - &server_artemis age1fm8meecmpus97y9ra9gjdk08g8njran6fv4jxnr0zegpfd89a9esayj39c
  - &server_legion_node1 age1fexn9r8huh294w3hmyst605fndjagyg7e3s23aqfedlqrqnn24rq5lvgr7
  - &server_legion_node2 age1f9t7ktuy3hny3lju3692mqx35mrc0wrfrl8mtelyeecc4lydcu0snxtm23
  - &server_legion_node3 age1yc37qpvazdtfswa38057e73sh523q0exj75qqahzgax6kqaxeqmsq2wx9t
  - &server_legion_node4 age1a80m5fpv387njdmg63q6vvkavahepdkx7zq4gjjkg62x3lme4f7q9s5c66
  - &server_zakkart age1dy6m8ldy4pnqhleqhkqtej3nxvvkyu9dflzjkctrxxwl2ddj5sjqzc4j3p

# One shard per consuming module, encrypted to the admin plus the hosts that run it.
# Anchor path_regex on the full path: shard files share the secrets*.yaml names.
creation_rules:
  # No Nix consumer -- stored data only (the admin's own stashed key).
  - path_regex: modules/sops/secrets\.admin\.yaml$
    key_groups:
    - age:
      - *user_aidanp

  # modules/user/default.nix -- every host.
  - path_regex: modules/user/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_artemis
      - *server_legion_node1
      - *server_legion_node2
      - *server_legion_node3
      - *server_legion_node4

  # modules/hosts/artemis/default.nix -- artemis only.
  - path_regex: modules/hosts/artemis/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_artemis

  # modules/backup-tunnel/default.nix -- both tunnel endpoints.
  - path_regex: modules/backup-tunnel/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_artemis
      - *server_legion_node1

  # modules/hosts/legion/default.nix -- every Legion node.
  - path_regex: modules/hosts/legion/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node1
      - *server_legion_node2
      - *server_legion_node3
      - *server_legion_node4

  # modules/backups/default.nix -- only the Legion nodes that own a Backup
  # Set. One repository password covers every Legion repository, so a node
  # with no backup job must not be a recipient.
  - path_regex: modules/backups/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node2
      - *server_legion_node4

  # modules/backups/default.nix (the /persist job) -- artemis only.
  - path_regex: modules/backups/secrets\.artemis\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_artemis

  # modules/edge/default.nix and modules/tinyauth.nix.
  - path_regex: modules/edge/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node1

  # modules/crowdsec/default.nix (edge engine) and
  # modules/netbird-server/proxy.nix (proxy bouncer client).
  - path_regex: modules/crowdsec/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node1
      - *server_legion_node2

  # modules/netbird-server/default.nix.
  - path_regex: modules/netbird-server/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node2

  # modules/netbird-server/proxy.nix.
  - path_regex: modules/netbird-server/secrets\.proxy\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node2

  # modules/pocket-id/default.nix.
  - path_regex: modules/pocket-id/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node2

  # modules/monitoring/default.nix.
  - path_regex: modules/monitoring/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node3

  # modules/garret/default.nix.
  - path_regex: modules/garret/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node4

  # modules/claude-code/default.nix -- the hosts that run Claude Code.
  - path_regex: modules/claude-code/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_artemis
      - *server_zakkart
