  - &server_legion_node2 age1f9t7ktuy3hny3lju3692mqx35mrc0wrfrl8mtelyeecc4lydcu0snxtm23
  - &server_legion_node3 age1yc37qpvazdtfswa38057e73sh523q0exj75qqahzgax6kqaxeqmsq2wx9t
  - &server_legion_node4 age1a80m5fpv387njdmg63q6vvkavahepdkx7zq4gjjkg62x3lme4f7q9s5c66

# Per-service Secret Shards (docs/DESIGN.md "Secret Shard"; docs/adr/0006).
# Each shard is encrypted only to the Human Administrator plus the
# host(s) whose modules consume it. path_regex is anchored to the full
# colocated path ($-anchored, disjoint) rather than the bare filename --
# every shard is named secrets.yaml (or secrets.proxy.yaml) beside its
# consuming module, so a bare filename regex would match multiple shards.
creation_rules:
  # No Nix consumer -- stored data only (the admin's own stashed key).
  - path_regex: modules/nixos/sops/secrets\.admin\.yaml$
    key_groups:
    - age:
      - *user_aidanp

  # modules/nixos/shared/default.nix -- every host.
  - path_regex: modules/nixos/shared/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_artemis
      - *server_legion_node1
      - *server_legion_node2
      - *server_legion_node3
      - *server_legion_node4

  # modules/hosts/legion/default.nix -- every Legion node.
  - path_regex: modules/hosts/legion/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node1
      - *server_legion_node2
      - *server_legion_node3
      - *server_legion_node4

  # modules/nixos/backups/default.nix -- every node with a Backup Set (not
  # the edge node, which runs no backup job).
  - path_regex: modules/nixos/backups/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node2
      - *server_legion_node3
      - *server_legion_node4

  # modules/nixos/edge/default.nix.
  - path_regex: modules/nixos/edge/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node1

  # modules/nixos/crowdsec/default.nix (edge engine) and
  # modules/nixos/netbird-server/proxy.nix (proxy bouncer client).
  - path_regex: modules/nixos/crowdsec/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node1
      - *server_legion_node2

  # modules/nixos/netbird-server/default.nix.
  - path_regex: modules/nixos/netbird-server/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node2

  # modules/nixos/netbird-server/proxy.nix.
  - path_regex: modules/nixos/netbird-server/secrets\.proxy\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node2

  # modules/nixos/pocket-id/default.nix.
  - path_regex: modules/nixos/pocket-id/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node2

  # modules/nixos/monitoring/default.nix.
  - path_regex: modules/nixos/monitoring/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node3

  # modules/nixos/hermes/default.nix.
  - path_regex: modules/nixos/hermes/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node3

  # modules/nixos/attic/default.nix.
  - path_regex: modules/nixos/attic/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node4

  # modules/nixos/garret/default.nix.
  - path_regex: modules/nixos/garret/secrets\.yaml$
    key_groups:
    - age:
      - *user_aidanp
      - *server_legion_node4
