# garret client config for CI (docs/adr/0013). Nothing here is secret.
#
# The client mints its own token from the GitHub Actions OIDC provider when
# ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN are present (garret-client
# src/auth.rs `bearer_token`), so there is no login step and no stored
# credential -- the `issuer`/`client_id` below are only needed because the
# config schema requires the `oidc` table, and are unused on that path.
endpoint = "https://cache-push.jeiang.dev"
puller_endpoint = "https://cache.jeiang.dev"

[oidc]
issuer = "https://token.actions.githubusercontent.com"
client_id = "github-actions"
# Must match the `audience` on the github-actions issuer in
# modules/nixos/garret/default.nix; the Pusher rejects a token minted for
# anything else.
audience = "https://cache-push.jeiang.dev/"
