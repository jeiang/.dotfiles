name: Install Nix
description: Install Nix with garret as a substituter, and optionally garret's post-build hook.

inputs:
  garret-hook:
    description: Install garret's post-build hook, for jobs that push to garret.
    default: "false"
  garret-substituter:
    description: garret's URL. Pulls are anonymous, so this needs no credentials.
    default: https://cache.jeiang.dev
  garret-public-key:
    description: garret's signing key; exported as GARRET_PUBLIC_KEY for .ci/garret.sh.
    default: cache.jeiang.dev-1:owXJK5/UX9NSf1lhmDDT3QTxMtbVk9YfHhjvOXyPhpA=

runs:
  using: composite
  steps:
    - name: Export garret's public key
      shell: bash
      env:
        KEY: ${{ inputs.garret-public-key }}
      run: echo "GARRET_PUBLIC_KEY=$KEY" >>"$GITHUB_ENV"

    # Before Nix is installed, because nix.conf names the hook.
    - name: Write garret's post-build hook
      if: inputs.garret-hook == 'true'
      shell: bash
      run: ./.ci/garret.sh hook

    # The substituter goes straight into nix.conf so evaluation-time IFD sources substitute too.
    # High job counts: a warm-cache build is substituter round-trips, not CPU.
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          extra-substituters = ${{ inputs.garret-substituter }}
          extra-trusted-public-keys = ${{ inputs.garret-public-key }}
          max-substitution-jobs = 32
          http-connections = 64
          ${{ inputs.garret-hook == 'true' && format('post-build-hook = {0}/garret-hook', runner.temp) || '' }}
