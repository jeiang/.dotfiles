# NETBIRD_READ_TOKEN is an Auditor-role personal access token: read-only
# across the whole management API, never a mutating call. nb-nix renews it
# (modules/netbird-management) and writes the new one here with `gh secret set`.
name: NetBird Drift

on:
  schedule:
    # Weekly drift check: live NetBird state against modules/netbird-management.
    - cron: "27 6 * * 1"
  workflow_dispatch:

# Read-only, so a superseded run can simply be cancelled.
concurrency:
  group: netbird-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    # Fork PRs are excluded explicitly, for parity with the other read-only
    # drift checks; this workflow never triggers on pull_request itself.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Require NETBIRD_READ_TOKEN
        env:
          NETBIRD_API_TOKEN: ${{ secrets.NETBIRD_READ_TOKEN }}
        run: |
          if [ -z "$NETBIRD_API_TOKEN" ]; then
            echo "::error::NETBIRD_READ_TOKEN secret is empty; see docs/runbooks/netbird.md" >&2
            exit 1
          fi

      # Exit 2 means live state differs from the flake; the plan shows how.
      - name: Plan against live state
        env:
          NETBIRD_API_TOKEN: ${{ secrets.NETBIRD_READ_TOKEN }}
        run: nix run --inputs-from . nb-nix -- plan -c "$(nix build --no-link --print-out-paths .#netbird-desired)" --detailed-exitcode
