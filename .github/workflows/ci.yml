name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main-branch run: it populates the authoritative cache state.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pulls are anonymous, so only pushes need credentials; those are minted
  # per-job from GitHub OIDC (only refs/heads/main is granted push server-side).
  GARRET_SUBSTITUTER: https://cache.jeiang.dev
  GARRET_PUBLIC_KEY: "cache.jeiang.dev-1:owXJK5/UX9NSf1lhmDDT3QTxMtbVk9YfHhjvOXyPhpA="

  # Raised from Nix's defaults: a warm-cache leg is substituter round-trips, not CPU.
  MAX_SUBSTITUTION_JOBS: "32"
  HTTP_CONNECTIONS: "64"

jobs:
  # Splitting checks into a matrix gives each one its own runner, memory and time
  # budget. This only evaluates checks.x86_64-linux, not the whole flake: some
  # packages need a build-capable evaluation just to resolve their attributes, so
  # a `nix flake check --no-build`-style pass over every output isn't viable here.
  discover:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.discover.outputs.checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The substituters go straight into nix.conf so evaluation-time
      # IFD sources substitute from the cache too.
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
            max-substitution-jobs = ${{ env.MAX_SUBSTITUTION_JOBS }}
            http-connections = ${{ env.HTTP_CONNECTIONS }}

      - name: Discover checks
        id: discover
        run: |
          checks=$(nix eval --json '.#checks.x86_64-linux' --apply builtins.attrNames)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    permissions:
      contents: read
      # Exchanged for a short-lived push token; the server only grants push to refs/heads/main.
      id-token: write
    strategy:
      fail-fast: false
      # Bounds cache-server load, not build capacity: legs mostly substitute from a warm cache.
      max-parallel: 10
      matrix:
        check: ${{ fromJson(needs.discover.outputs.checks) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Baking the substituter into nix.conf here needs no client, login, or secrets: pulls are anonymous.
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
            max-substitution-jobs = ${{ env.MAX_SUBSTITUTION_JOBS }}
            http-connections = ${{ env.HTTP_CONNECTIONS }}

      # print-out-paths can emit multiple lines, so use the GITHUB_OUTPUT
      # delimiter form rather than a plain key=value line.
      - name: Build check
        id: build
        env:
          CHECKS: ${{ matrix.check }}
          SYSTEM: x86_64-linux
        run: |
          installables=()
          for attr in $CHECKS; do installables+=(".#checks.${SYSTEM}.${attr}"); done
          paths=$(nix build --keep-going --show-trace --no-link --print-out-paths "${installables[@]}")
          delimiter="$(openssl rand -hex 8)"
          {
            echo "paths<<$delimiter"
            echo "$paths"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # Main pushes only; best-effort (continue-on-error plus the push script's
      # soft-fail) since a cache outage must never turn main red. Also pushes
      # the garret client's own path so later installs substitute instead of
      # building it from source; statix/treefmt have nothing worth pushing.
      - name: Push to garret
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.check != 'statix' && matrix.check != 'treefmt'
        continue-on-error: true
        env:
          PATHS: ${{ steps.build.outputs.paths }}
        run: |
          garret_rev=$(jq -r '.nodes.garret.locked.rev' flake.lock)
          nix profile install "github:jeiang/garret/${garret_rev}#garret"
          client_path=$(nix build --no-link --print-out-paths "github:jeiang/garret/${garret_rev}#garret")
          ./.ci/garret-push.sh $PATHS $client_path

  # Not part of the discover/build matrix: darwin builds only the fixed
  # zakkart-system attribute, so a matrix would add nothing here.
  build-macos:
    permissions:
      contents: read
      id-token: write
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
            max-substitution-jobs = ${{ env.MAX_SUBSTITUTION_JOBS }}
            http-connections = ${{ env.HTTP_CONNECTIONS }}

      - name: Build check
        id: build
        run: |
          paths=$(nix build --keep-going --show-trace --no-link --print-out-paths ".#checks.aarch64-darwin.zakkart-system")
          delimiter="$(openssl rand -hex 8)"
          {
            echo "paths<<$delimiter"
            echo "$paths"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # Main pushes only; best-effort, and also pushes the garret client's own
      # path so later installs substitute instead of building it from source.
      - name: Push to garret
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PATHS: ${{ steps.build.outputs.paths }}
        run: |
          garret_rev=$(jq -r '.nodes.garret.locked.rev' flake.lock)
          nix profile install "github:jeiang/garret/${garret_rev}#garret"
          client_path=$(nix build --no-link --print-out-paths "github:jeiang/garret/${garret_rev}#garret")
          ./.ci/garret-push.sh $PATHS $client_path

  # Single stable required status context: `build` fans out into one context
  # per matrix leg, which branch protection can't require directly.
  all-checks:
    needs: [discover, build, build-macos]
    # Runs even when a leg fails: a skipped required check blocks merges just like a failing one.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify discovery and all matrix checks passed
        run: |
          echo "discover:    ${{ needs.discover.result }}"
          echo "build:       ${{ needs.build.result }}"
          echo "build-macos: ${{ needs.build-macos.result }}"
          if [[ "${{ needs.discover.result }}" != "success" || "${{ needs.build.result }}" != "success" || "${{ needs.build-macos.result }}" != "success" ]]; then
            echo "::error::One or more required checks did not succeed."
            exit 1
          fi
          echo "All checks passed."
