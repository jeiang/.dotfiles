name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main-branch run: it populates the authoritative cache state.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pulls are anonymous, so only pushes need credentials; those are minted
  # per-job from GitHub OIDC (only main and v* tags are granted push server-side).
  GARRET_SUBSTITUTER: https://cache.jeiang.dev
  GARRET_PUBLIC_KEY: "cache.jeiang.dev-1:owXJK5/UX9NSf1lhmDDT3QTxMtbVk9YfHhjvOXyPhpA="

  # High: a warm-cache leg is substituter round-trips, not CPU.
  MAX_SUBSTITUTION_JOBS: "32"
  HTTP_CONNECTIONS: "64"

jobs:
  # Splitting checks into a matrix gives each one its own runner, memory and time
  # budget. This only evaluates checks.x86_64-linux, not the whole flake: some
  # packages need a build-capable evaluation just to resolve their attributes, so
  # a `nix flake check --no-build`-style pass over every output isn't viable here.
  discover:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.discover.outputs.checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The substituters go straight into nix.conf so evaluation-time
      # IFD sources substitute from the cache too.
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
            max-substitution-jobs = ${{ env.MAX_SUBSTITUTION_JOBS }}
            http-connections = ${{ env.HTTP_CONNECTIONS }}

      - name: Discover checks
        id: discover
        run: |
          checks=$(nix eval --json '.#checks.x86_64-linux' --apply builtins.attrNames)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    permissions:
      contents: read
      # Exchanged for a short-lived push token; the server only grants push to main and v* tags.
      id-token: write
    strategy:
      fail-fast: false
      # Bounds cache-server load, not build capacity: legs mostly substitute from a warm cache.
      max-parallel: 10
      matrix:
        check: ${{ fromJson(needs.discover.outputs.checks) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before Nix is installed, because nix.conf names the hook.
      - name: Write garret's post-build hook
        run: ./.ci/garret.sh hook

      # Baking the substituter into nix.conf here needs no client, login, or secrets: pulls are anonymous.
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
            max-substitution-jobs = ${{ env.MAX_SUBSTITUTION_JOBS }}
            http-connections = ${{ env.HTTP_CONNECTIONS }}
            post-build-hook = ${{ runner.temp }}/garret-hook

      # Main pushes only, best-effort (continue-on-error) since a cache outage
      # must never turn main red; statix/treefmt have nothing worth pushing.
      - name: Start pushing to garret as paths are built
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.check != 'statix' && matrix.check != 'treefmt'
        continue-on-error: true
        run: ./.ci/garret.sh watch

      - name: Build check
        env:
          CHECKS: ${{ matrix.check }}
          SYSTEM: x86_64-linux
        run: |
          installables=()
          for attr in $CHECKS; do installables+=(".#checks.${SYSTEM}.${attr}"); done
          nix build --keep-going --show-trace --no-link --print-out-paths "${installables[@]}" >"$RUNNER_TEMP/garret-outputs"

      # Also after a failed build, so the next run substitutes what this one built.
      - name: Push to garret what the watcher has not
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.check != 'statix' && matrix.check != 'treefmt'
        continue-on-error: true
        timeout-minutes: 30
        run: ./.ci/garret.sh drain

  # A PR whose zakkart derivation matches its base skips the macOS runner;
  # main always builds it so garret holds the closure. Any evaluation
  # failure counts as changed.
  darwin-changed:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
            max-substitution-jobs = ${{ env.MAX_SUBSTITUTION_JOBS }}
            http-connections = ${{ env.HTTP_CONNECTIONS }}

      - name: Compare the zakkart derivation with the base
        id: compare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            attr=darwinConfigurations.zakkart.config.system.build.toplevel.drvPath
            if new=$(nix eval --raw ".#$attr") && old=$(nix eval --raw "git+file://$PWD?rev=$BASE_SHA#$attr") && [ "$new" = "$old" ]; then
              changed=false
            fi
          fi
          echo "changed=$changed" >>"$GITHUB_OUTPUT"

  # Not part of the discover/build matrix: darwin builds only the fixed
  # zakkart-system attribute, so a matrix would add nothing here.
  build-macos:
    needs: darwin-changed
    if: needs.darwin-changed.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write garret's post-build hook
        run: ./.ci/garret.sh hook

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
            max-substitution-jobs = ${{ env.MAX_SUBSTITUTION_JOBS }}
            http-connections = ${{ env.HTTP_CONNECTIONS }}
            post-build-hook = ${{ runner.temp }}/garret-hook

      - name: Start pushing to garret as paths are built
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: ./.ci/garret.sh watch

      - name: Build check
        run: nix build --keep-going --show-trace --no-link --print-out-paths ".#checks.aarch64-darwin.zakkart-system" >"$RUNNER_TEMP/garret-outputs"

      - name: Push to garret what the watcher has not
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 30
        run: ./.ci/garret.sh drain

  # Single stable required status context: `build` fans out into one context
  # per matrix leg, which branch protection can't require directly.
  all-checks:
    needs: [discover, build, darwin-changed, build-macos]
    # Runs even when a leg fails: a skipped required check blocks merges just like a failing one.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify discovery and all matrix checks passed
        env:
          DISCOVER: ${{ needs.discover.result }}
          BUILD: ${{ needs.build.result }}
          DARWIN_CHANGED: ${{ needs.darwin-changed.result }}
          CHANGED: ${{ needs.darwin-changed.outputs.changed }}
          BUILD_MACOS: ${{ needs.build-macos.result }}
        run: |
          echo "discover:       $DISCOVER"
          echo "build:          $BUILD"
          echo "darwin-changed: $DARWIN_CHANGED ($CHANGED)"
          echo "build-macos:    $BUILD_MACOS"
          macos_ok=false
          if [ "$BUILD_MACOS" = success ] || { [ "$CHANGED" = false ] && [ "$BUILD_MACOS" = skipped ]; }; then
            macos_ok=true
          fi
          if [ "$DISCOVER" != success ] || [ "$BUILD" != success ] || [ "$DARWIN_CHANGED" != success ] || [ "$macos_ok" != true ]; then
            echo "::error::One or more required checks did not succeed."
            exit 1
          fi
          echo "All checks passed."
