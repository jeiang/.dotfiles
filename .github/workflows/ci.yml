name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main-branch run: it's the one populating the authoritative
  # cache state, and cancelling it mid-push would leave things half-populated.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Both caches are public for reads: pulls are anonymous on every event
  # (PRs and forks included), so substitution needs no client, no login, and
  # no secrets — just the substituters and their signing keys in nix.conf
  # below. Push credentials are minted per-job by the garret client itself
  # from GitHub OIDC, and only main is granted push server-side
  # (modules/nixos/garret/default.nix `ref_patterns`).
  #
  # attic is read-only through the side-by-side window (docs/adr/0013): it
  # is still listed as a substituter so paths pushed before the cutover keep
  # resolving, but nothing pushes to it any more. Both entries go away with
  # the retirement.
  GARRET_SUBSTITUTER: https://cache.jeiang.dev
  GARRET_PUBLIC_KEY: "cache.jeiang.dev-1:owXJK5/UX9NSf1lhmDDT3QTxMtbVk9YfHhjvOXyPhpA="
  ATTIC_SUBSTITUTER: https://attic.jeiang.dev/default
  ATTIC_PUBLIC_KEY: "default:Xaqeg5b1ctNwH4sEWG+nt1kSpGPpFG0zivJUbZyCfdM="

jobs:
  # Source of the check matrix below. Building every check in a single job
  # previously ran for hours and got killed with no useful logs (likely OOM
  # from building 6 NixOS closures, one with a full-LTO kernel, plus every
  # package, all in one process) — splitting into a matrix gives each check
  # its own runner, memory budget, and time budget.
  #
  # This only evaluates checks.x86_64-linux, not the whole flake: some
  # packages (e.g. Hyprland, which reads a VERSION file from its own source
  # at eval time) need a build-capable evaluation just to resolve their
  # attributes, so a `nix flake check --no-build`-style pass over every
  # output isn't viable here. The `build` job below is what actually
  # validates each check.
  discover:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.discover.outputs.checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The substituters go straight into nix.conf so evaluation-time
      # IFD sources substitute from the cache too.
      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }} ${{ env.ATTIC_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }} ${{ env.ATTIC_PUBLIC_KEY }}

      - name: Discover checks
        id: discover
        run: |
          checks=$(nix eval --json '.#checks.x86_64-linux' --apply builtins.attrNames)
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    permissions:
      contents: read
      # The garret client exchanges this for a short-lived push token right
      # before pushing; the server only grants push to `refs/heads/main`
      # (modules/nixos/garret/default.nix), so PR runs never use it.
      id-token: write
    strategy:
      fail-fast: false
      # 2 was set when every job compiled heavyweight closures from scratch;
      # with the cache warm, jobs are mostly network-bound substitution, so a
      # higher cap mainly trades cache server load for wall-clock time. Raise
      # further if the cache keeps up.
      max-parallel: 6
      matrix:
        check: ${{ fromJson(needs.discover.outputs.checks) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      # Pulls are anonymous against the public cache: baking the substituter
      # into nix.conf here means every nix invocation below substitutes from
      # the caches with zero setup steps — no client, no login, no secrets.
      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }} ${{ env.ATTIC_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }} ${{ env.ATTIC_PUBLIC_KEY }}

      # print-out-paths emits one line per derivation output (e.g. mangohud's
      # "out" and "man"), so this can be multi-line — write it to
      # $GITHUB_OUTPUT with the delimiter form rather than a plain
      # key=value line, which breaks on embedded newlines.
      - name: Build check
        id: build
        run: |
          paths=$(nix build --keep-going --show-trace --no-link --print-out-paths ".#checks.x86_64-linux.${{ matrix.check }}")
          delimiter="$(openssl rand -hex 8)"
          {
            echo "paths<<$delimiter"
            echo "$paths"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # Main pushes only: PRs pull anonymously and never need a client or a
      # token. There is no login step — the garret client mints its own
      # short-lived token from this job's OIDC provider (garret-client
      # src/auth.rs `bearer_token`), which is why `id-token: write` above is
      # still required.
      #
      # The client rev comes from flake.lock (the same pin the flake itself
      # uses). Unlike attic-client, that build is NOT yet pre-seeded in any
      # cache, so these first runs compile a Rust workspace from source;
      # once jeiang/garret's own CI pushes its client build to
      # cache.jeiang.dev, the install substitutes in seconds instead.
      #
      # The push is best-effort by design (continue-on-error plus the push
      # script's soft-fail): the cache is an optimization, and a cache
      # outage must never turn main red.
      #
      # PATHS goes through the environment rather than being spliced
      # directly into the run script: the output can be multiple
      # newline-separated paths, and unquoted $PATHS lets the shell
      # word-split it into separate push arguments, whereas templating it
      # straight into the YAML would paste literal newlines into the script
      # and turn each extra path into its own (invalid) command.
      - name: Push to garret
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PATHS: ${{ steps.build.outputs.paths }}
        run: |
          garret_rev=$(jq -r '.nodes.garret.locked.rev' flake.lock)
          nix profile install "github:jeiang/garret/${garret_rev}#garret"
          ./.ci/garret-push.sh $PATHS

  # Builds the zakkart darwin toplevel (checks.aarch64-darwin.zakkart-system,
  # modules/checks.nix) on a hosted macOS runner (arm64). Not part of the
  # `discover`/`build` matrix -- `discover` only enumerates
  # checks.x86_64-linux, and this is a single fixed attribute rather than a
  # per-check fan-out, so it's simpler as its own job than folded into that
  # matrix. Same pure `nix build` and best-effort cache push pattern as
  # `build` above.
  build-macos:
    permissions:
      contents: read
      id-token: write
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }} ${{ env.ATTIC_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }} ${{ env.ATTIC_PUBLIC_KEY }}

      - name: Build check
        id: build
        run: |
          paths=$(nix build --keep-going --show-trace --no-link --print-out-paths ".#checks.aarch64-darwin.zakkart-system")
          delimiter="$(openssl rand -hex 8)"
          {
            echo "paths<<$delimiter"
            echo "$paths"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Push to garret
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PATHS: ${{ steps.build.outputs.paths }}
        run: |
          garret_rev=$(jq -r '.nodes.garret.locked.rev' flake.lock)
          nix profile install "github:jeiang/garret/${garret_rev}#garret"
          ./.ci/garret-push.sh $PATHS

  # Aggregate gate: a single, stable status context that reflects the whole
  # matrix, for branch protection to require. The `build` job above fans out
  # into one context per discovered check (`build (toplevel-legion-node1)`,
  # `build (package-caddy)`, ...) whose set changes as checks are added or
  # removed, and there is no bare `build` context — so requiring the matrix
  # directly is either brittle (name-per-check) or never satisfiable (a `build`
  # requirement stays perpetually pending, silently blocking every merge). This
  # job depends on the whole matrix and succeeds only if discovery and every
  # matrix leg did, so `all-checks` is the one context to mark required in the
  # branch ruleset.
  #
  # `if: always()` is required: without it, a failed matrix leg would skip this
  # job, and a *skipped* required check blocks the PR just like a failing one
  # (with no red signal explaining why). Running always lets it turn the result
  # into an explicit pass/fail. Note `needs.build.result` collapses the whole
  # matrix — it is `success` only when every leg succeeded, and `failure` if any
  # leg failed — and the best-effort `Push to garret` step above is
  # `continue-on-error`, so a cache-push hiccup never fails a leg or this gate.
  all-checks:
    needs: [discover, build, build-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify discovery and all matrix checks passed
        run: |
          echo "discover:    ${{ needs.discover.result }}"
          echo "build:       ${{ needs.build.result }}"
          echo "build-macos: ${{ needs.build-macos.result }}"
          if [[ "${{ needs.discover.result }}" != "success" || "${{ needs.build.result }}" != "success" || "${{ needs.build-macos.result }}" != "success" ]]; then
            echo "::error::One or more required checks did not succeed."
            exit 1
          fi
          echo "All checks passed."
