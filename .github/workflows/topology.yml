name: Topology

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Render topology
        run: |
          out=$(nix build --no-link --print-out-paths ".#topology.x86_64-linux.config.output")
          rm -f docs/topology/*.svg
          install -m 644 "$out"/*.svg docs/topology/

      - name: Open pull request if the diagrams changed
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          commit-message: "docs: regenerate topology diagrams"
          title: "docs: regenerate topology diagrams"
          body: Weekly re-render of `docs/topology/` from the host configurations.
          branch: ci/topology
          delete-branch: true
          add-paths: docs/topology/*.svg
