name: Topology

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Render topology
        run: |
          out=$(nix build --no-link --print-out-paths ".#topology.x86_64-linux.config.output")
          rm -f docs/topology/*.svg
          install -m 644 "$out"/*.svg docs/topology/

      # main requires signed commits.
      - name: Open pull request if the diagrams changed
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "docs: regenerate topology diagrams"
          title: "docs: regenerate topology diagrams"
          body: Weekly re-render of `docs/topology/` from the host configurations.
          branch: ci/topology
          delete-branch: true
          add-paths: docs/topology/*.svg
          sign-commits: true

      # A pull request that the workflow token opens starts no workflow, and `all-checks` is required.
      - name: Run CI on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref ci/topology
