# CLOUDFLARE_DNS_TOKEN is scoped to Zone:Read + DNS:Edit on these zones and is separate from Caddy's DNS-01 token.
name: DNS

on:
  pull_request:
    paths:
      - dns/**
      - .github/workflows/dns.yml
  push:
    branches:
      - main
    paths:
      - dns/**
      - .github/workflows/dns.yml
  schedule:
    # Weekly drift check.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Applies on main share one group and never cancel: two quick merges must
# apply in order, and a push must not be killed mid-correction.
concurrency:
  group: dns-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # Fork PRs are excluded explicitly. GitHub already withholds secrets
    # from them, so a fork run could only fail with an auth error — this
    # just skips it instead of leaving a red herring on the PR.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # --inputs-from . resolves nixpkgs to this repo's flake.lock pin, so
      # CI runs the same dnscontrol build the devshell carries.
      - name: Preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
        run: nix run --inputs-from . nixpkgs#dnscontrol -- preview --config dns/dnsconfig.js --creds dns/creds.json

      # Scheduled/manual runs are the drift check: any pending correction
      # means live state no longer matches the repo, so exit non-zero.
      - name: Drift check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
        run: nix run --inputs-from . nixpkgs#dnscontrol -- preview --expect-no-changes --config dns/dnsconfig.js --creds dns/creds.json

      - name: Push
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
        run: nix run --inputs-from . nixpkgs#dnscontrol -- push --config dns/dnsconfig.js --creds dns/creds.json
