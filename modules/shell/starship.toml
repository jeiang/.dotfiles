"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
format = '$username$hostname$directory$git_branch$git_commit$git_state$git_status$cmd_duration$line_break$jobs$sudo$character'
right_format = '$nix_shell$container'

[directory]
style = 'blue'
home_symbol = '⌂'
truncation_length = 3
read_only = ' ◈'

[username]
format = '[$user]($style) '
style_user = 'yellow'
style_root = 'bold red'

[hostname]
format = '[$hostname]($style) '
style = 'yellow'

[git_branch]
format = '[$branch]($style) '
style = 'bright-black'
only_attached = true

[git_commit]
format = '[$hash]($style) '
style = 'bright-black'

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = 'yellow'

[git_status]
format = '([*$untracked$modified$staged$renamed$deleted$typechanged]($style) )([$conflicted](bold red) )([$ahead_behind](cyan) )'
style = 'purple'
# Nonempty zero-width values make the dirty group conditional without showing separate symbols.
untracked = "\u200b"
modified = "\u200b"
staged = "\u200b"
renamed = "\u200b"
deleted = "\u200b"
typechanged = "\u200b"
conflicted = '!'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↑${ahead_count} ↓${behind_count}'

[cmd_duration]
min_time = 2_000
format = '[$duration]($style) '
style = 'yellow'

[jobs]
format = '[$symbol$number]($style) '
symbol = '▶'
style = 'dimmed white'

[sudo]
disabled = false
format = '[$symbol]($style)'
symbol = '⋈┈'
style = 'bold italic bright-purple'

[character]
success_symbol = '[◎](bold bright-yellow)'
error_symbol = '[○](red)'
vimcmd_symbol = '[■](green)'
vimcmd_replace_one_symbol = '◌'
vimcmd_replace_symbol = '□'
vimcmd_visual_symbol = '▼'

[nix_shell]
format = '[$symbol nix]($style)'
symbol = '✶'
style = 'dimmed blue'

[container]
format = ' [⬡ $name]($style)'
style = 'dimmed blue'
