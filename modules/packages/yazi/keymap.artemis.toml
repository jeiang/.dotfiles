[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "Context-aware paste"

[[mgr.prepend_keymap]]
on   = "/"
run  = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on   = ["g", "e"]
run  = "arrow bot"
desc = "Go to the bottom"

# rip replaces yazi's built-in trash (the trash crate creates .Trash-1000 at
# bind-mount roots such as ~/Downloads, breaking the home-trash rule).
[[mgr.prepend_keymap]]
on   = "d"
run  = "shell -- rip -- %s"
desc = "Trash the selection"

[[mgr.prepend_keymap]]
on   = "T"
run  = "shell -- rip -- %s"
desc = "Trash the selection"

[[mgr.prepend_keymap]]
on   = "C"
run  = "plugin ouch"
desc = "Compress with ouch"
